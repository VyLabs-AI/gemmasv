<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 58 760 510" role="img" aria-labelledby="longmemeval-summary-t" aria-describedby="longmemeval-summary-d"><title id="longmemeval-summary-t">The fresh-omission gap is distinct from implementation conformance</title><desc id="longmemeval-summary-d">Panel a shows 8.33 nats of target suppression for edited policy versus 0.53 nats for prompt-only suppression. Panel b places retained-answer change on the same logarithmic nat scale as the deleted answer: 8.05e-5 nats of mean absolute retained log-probability change and 1.90e-6 nats of retained first-token KL to fresh omission, four to five orders of magnitude below the suppression of the deleted answer. Panel c headlines the 2.15-nat policy-to-fresh-omission gap beside the 1.75e-16 implementation check against an independently constructed retained-key refit.</desc><rect width="760" height="712" fill="#ffffff" /><text x="24" y="92" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.670000000000002" font-weight="700" fill="#263238" text-anchor="start">(a)</text><line x1="130" y1="300" x2="730" y2="300" stroke="#263238" stroke-width="1" /><text x="122" y="303.5" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.9756" font-weight="400" fill="#263238" text-anchor="end">0</text><line x1="130" y1="260" x2="730" y2="260" stroke="#cfd8dc" stroke-width="0.7" /><text x="122" y="263.5" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.9756" font-weight="400" fill="#263238" text-anchor="end">2</text><line x1="130" y1="220" x2="730" y2="220" stroke="#cfd8dc" stroke-width="0.7" /><text x="122" y="223.5" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.9756" font-weight="400" fill="#263238" text-anchor="end">4</text><line x1="130" y1="180" x2="730" y2="180" stroke="#cfd8dc" stroke-width="0.7" /><text x="122" y="183.5" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.9756" font-weight="400" fill="#263238" text-anchor="end">6</text><line x1="130" y1="140" x2="730" y2="140" stroke="#cfd8dc" stroke-width="0.7" /><text x="122" y="143.5" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.9756" font-weight="400" fill="#263238" text-anchor="end">8</text><text x="205" y="291" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.4426" font-weight="700" fill="#263238" text-anchor="middle" letter-spacing="-0.02em">0.00</text><text x="205" y="319" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.4426" font-weight="600" fill="#263238" text-anchor="middle">record</text><text x="205" y="333" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.4426" font-weight="600" fill="#263238" text-anchor="middle">present</text><rect x="303" y="289.4" width="104" height="10.600000000000023" rx="1" fill="#ffe6e2" stroke="#ff1f00" stroke-width="1.2" /><text x="355" y="280.4" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.4426" font-weight="700" fill="#ff1f00" text-anchor="middle" letter-spacing="-0.02em">0.53</text><text x="355" y="319" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.4426" font-weight="600" fill="#263238" text-anchor="middle">prompt-only</text><rect x="453" y="168.6" width="104" height="131.4" rx="1" fill="#ffffff" stroke="#263238" stroke-width="1.2" stroke-dasharray="4 3" /><text x="505" y="159.6" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.4426" font-weight="700" fill="#263238" text-anchor="middle" letter-spacing="-0.02em">6.57</text><text x="505" y="319" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.4426" font-weight="600" fill="#263238" text-anchor="middle">raw-history</text><text x="505" y="333" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.4426" font-weight="600" fill="#263238" text-anchor="middle">rebuild</text><rect x="603" y="133.4" width="104" height="166.6" rx="1" fill="#0053a3" stroke="#0053a3" stroke-width="1.2" /><text x="655" y="124.4" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.4426" font-weight="700" fill="#0053a3" text-anchor="middle" letter-spacing="-0.02em">8.33</text><text x="655" y="319" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.4426" font-weight="600" fill="#263238" text-anchor="middle">edited</text><text x="655" y="333" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.4426" font-weight="600" fill="#263238" text-anchor="middle">policy</text><text x="76" y="205" font-family="'Source Serif 4', Georgia, serif" font-size="11.4426" font-weight="400" fill="#607d8b" text-anchor="middle" font-style="italic" transform="rotate(-90 76 205)">target suppression (nats)</text><text x="505" y="142.6" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.9756" font-weight="400" fill="#263238" text-anchor="middle">rebuild reference</text><text x="24" y="376" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.670000000000002" font-weight="700" fill="#263238" text-anchor="start">(b)</text><line x1="290" y1="398" x2="290" y2="500" stroke="#cfd8dc" stroke-width="0.7" /><text x="290" y="522" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.9756" font-weight="400" fill="#263238" text-anchor="middle">10⁻⁶</text><line x1="352.85714285714283" y1="398" x2="352.85714285714283" y2="500" stroke="#cfd8dc" stroke-width="0.7" /><text x="352.85714285714283" y="522" font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.9756" font-weight="400" fill="#263238" text-anchor="middle">10⁻⁵</text><line x1="415.7142857142857" y1="398" x2="415.7142857142857" y2="500" stroke="#cfd8dc" stroke-width