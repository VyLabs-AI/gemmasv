<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="longmem-title" aria-describedby="longmem-desc"><title id="longmem-title">One LongMemEval case separates behavioral suppression from a numerical certificate</title><desc id="longmem-desc">A measured teacher-forced case moves from a confirmed record-level forget request to an evaluated fixed-C policy. A behavioral panel compares target probability with fresh raw omission. A separate numerical panel compares policy output with the fixed-C retained-key refit and states that decoded responses, state equality, and causal regeneration are not covered.</desc><metadata>{&quot;schema&quot;:&quot;gemma-sv-longmemeval-chat-forgetting-payload-v2&quot;,&quot;record_id&quot;:&quot;longmemeval-constrained-chat-v1-c8276e265e3db489c090cdcc&quot;,&quot;payload_integrity_sha256&quot;:&quot;7b52beb7665888ddd96ba6f79f392b4c538650dfd25ae7a1336e4047d2a7802a&quot;}</metadata><rect width="1000" height="1060" fill="#FFFFFF"/><text x="500" y="28" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E7D5B" text-anchor="middle"><tspan x="500" dy="0">MEASURED CASE · 16/16 REPORT</tspan></text><text x="32" y="72" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#171717" text-anchor="start"><tspan x="32" dy="0">(a)</tspan></text><text x="84" y="72" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#171717" text-anchor="start"><tspan x="84" dy="0">Evaluated record-level workflow</tspan></text><rect x="32" y="96" width="210" height="128" rx="12" fill="#EEF3F7" stroke="#2F6F9F" stroke-width="1.6"/><text x="47" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2F6F9F" text-anchor="start"><tspan x="47" dy="0">1  SELECTED UNIT</tspan></text><text x="47" y="184" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-