font-size="24" font-weight="700" fill="#171717" text-anchor="start"><tspan x="32" dy="0">(b)</tspan></text><text x="84" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#171717" text-anchor="start"><tspan x="84" dy="0">Comparison A — policy vs fresh omission</tspan></text><rect x="32" y="326" width="936" height="290" rx="12" fill="#FBFBFA" stroke="#D4D7DA" stroke-width="1.5"/><text x="58" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2F6F9F" text-anchor="start"><tspan x="58" dy="0">TARGET ANSWER PROBABILITY</tspan></text><text x="58" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#171717" text-anchor="start"><tspan x="58" dy="0">record present</tspan><tspan x="58" dy="52">fresh omission</tspan><tspan x="58" dy="52">evaluated policy</tspan></text><text x="430" y="420" font-family="Liberation Mono, monospace" font-size="22" font-weight="700" fill="#171717" text-anchor="end"><tspan x="430" dy="0">0.00611</tspan><tspan x="430" dy="52">2.63e-10</tspan><tspan x="430" dy="52">1.40e-11</tspan></text><line x1="482" y1="350" x2="482" y2="592" stroke="#D4D7DA" stroke-width="1.2"/><text x="520" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#A56A16" text-anchor="start"><tspan x="520" dy="0">MEASURED</tspan></text><text x="520" y="408" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#62676D" text-anchor="start"><tspan x="520" dy="0">registered target score</tspan></text><text x="520" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2F6F9F" text-anchor="start"><tspan x="520" dy="0">ESTABLISHES</tspan></text><text x="520" y="506" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#2F6F9F" text-anchor="start"><tspan x="520" dy="0">target suppression in this case</tspan></text><text x="520" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#62676D" text-anchor="start"><tspan x="520" dy="0">NOT COVERED</tspan></text><text x="718" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#62676D" text-anchor="start"><tspan x="718" dy="0">decoded response</tspan></text><text x="32" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#171717" text-anchor="start"><tspan x="32" dy="0">(c)</tspan></text><text x="84" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#171717" text-anchor="start"><tspan x="84" dy="0">Comparison B — policy vs exact refit reference</tspan></text><rect x="32" y="704" width="936" height="230" rx="12" fill="#F7FBF9" stroke="#2E7D5B" stroke-width="1.5"/><text x="58" y="750" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E7D5B" text-anchor="start"><tspan x="58" dy="0">REFERENCE</tspan></text><text x="58" y="790" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#2E7D5B" text-anchor="start"><tspan x="58" dy="0">exact retained-key</tspan><tspan x="58" dy="30">refit</tspan></text><line x1="300" y1="816" x2="344" y2="816" stroke="#A56A16" stroke-width="2"/><path d="M354 816 l-10 -7 v14 z" fill="#A56A16"/><text x="380" y="750" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#A56A16" text-anchor="start"><tspan x="380" dy="0">MEASURED</tspan></text><text x="380" y="790" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#62676D" text-anchor="start"><tspan x="380" dy="0">KL(policy ‖ exact refit)</tspan></text><text x="380" y="845" font-family="Liberation Mono, monospace" font-size="28" font-weight="700" fill="#2E7D5B" text-anchor="start"><tspan x="380" dy="0">4.33e-17</tspan></text><line x1="606" y1="816" x2="650" y2="816" stroke="#A56A16" stroke-width="2"/><path d="M660 816 l-10 -7 v14 z" fill="#A56A16"/><text x="686" y="750" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E7D5B" text-anchor="start"><tspan x="686" dy="0">ESTABLISHES</tspan></text><text x="686" y="790" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#2E7D5B" text-anchor="start"><tspan x="686" dy="0">output agreement</tspan></text><text x="686" y="822" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#2E7D5B" text-anchor="start"><tspan x="686" dy="0">retained P 0.999954</tspan></text><text x="686" y="862" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#62676D" text-anchor="start"><tspan x="686" dy="0">NOT COVERED</tspan></text><text x="686" y="892" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#62676D" text-anchor="start"><tspan x="686" dy="0">state equality</tspan><tspan x="686" dy="26">causal regeneration</tspan></text><rect x="32" y="966" width="936" height="70" rx="12" fill="#EFF1F2" stroke="#D4D7DA" stroke-width="1.2"/><text x="52" y="1008" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#62676D" text-anchor="start"><tspan x="52" dy="0">BOUNDARY</tspan></text><text x="220" y="1008" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#62676D" text-anchor="start"><tspan x="220" dy="0">One predeclared case; no decoded-response outcome artifact exists.</tspan></text></svg>
