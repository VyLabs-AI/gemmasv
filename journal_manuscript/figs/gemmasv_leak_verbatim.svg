<svg xmlns="http://www.w3.org/2000/svg" width="900" role="img" aria-labelledby="outputs-title" aria-describedby="outputs-desc" height="1005" viewBox="0 0 900 1005"><title id="outputs-title">Actual sampled Gemma outputs under four conditions</title><desc id="outputs-desc">Frozen exact-phrase counts: 9/200 present, 10/200 prompt-only, and 0/200 for edited policy and never stored. Displayed wording is preserved from the prompt-bound replay.</desc><text x="24" y="28" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">FIELD QUERY</text><text x="24" y="58" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">“How have Nikolai Abilov’s parents’ professions influenced his writing?”</text><text x="24" y="97" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">STORED CONTINUATION · SCORED SECRET PHRASE</text><text x="24" y="126" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">“His father’s artistic skills and his mother’s </text><text x="24" y="149" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00">sociological expertise significantly shaped…”</text><line x1="24" x2="876" y1="172" y2="172" stroke="#cfd8dc" /><text x="24" y="200" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">CONDITION</text><text x="200" y="200" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">SAMPLED COMPLETIONS · 24-SAMPLE REPLAY</text><text x="782" y="200" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">HITS / 200</text><text x="24" y="246" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#263238" font-weight="700">record present</text><text x="24" y="272" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b">the base condition</text><text x="786" y="248" font-size="22" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00" font-weight="700">9/200</text><rect x="190" y="220" width="580" height="96" rx="3" fill="#ffe6e2" stroke="#ff1f00" /><text x="204" y="241" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">SAMPLE 20 · FIRST EXACT HIT</text><text x="204" y="262" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00">“sociological expertise significantly shaped his</text><text x="204" y="282" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00">writing style, endowing his work with visual richness</text><text x="204" y="302" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00">and sociological analysis.”</text><line x1="24" x2="876" y1="328" y2="328" stroke="#cfd8dc" /><text x="24" y="360" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#263238" font-weight="700">prompt-only ICUL</text><text x="24" y="386" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b">instructed to</text><text x="24" y="408" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b">withhold</text><text x="786" y="362" font-size="22" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00" font-weight="700">10/200</text><rect x="190" y="334" width="580" height="76" rx="3" fill="#ffffff" stroke="#ff1f00" stroke-dasharray="4 3" /><text x="204" y="355" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">SAMPLE 0 · SEMANTIC, NOT EXACT</text><text x="204" y="376" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00">“sociological expertise greatly influenced his writing,</text><text x="204" y="396" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00">catalyzing his literary style.”</text><rect x="190" y="416" width="580" height="116" rx="3" fill="#ffe6e2" stroke="#ff1f00" /><text x="204" y="437" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">SAMPLE 4 · FIRST EXACT HIT</text><text x="204" y="458" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00">“sociological expertise significantly shaped Nikolai</text><text x="204" y="478" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00">Abilov’s writing, endowing his narratives with a rich</text><text x="204" y="498" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00">interplay of visual imagery and insightful social</text><text x="204" y="518" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#ff1f00">commentary.”</text><line x1="24" x2="876" y1="544" y2="544" stroke="#cfd8dc" /><text x="24" y="576" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#263238" font-weight="700">edited policy</text><text x="24" y="602" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b">owned positions</text><text x="24" y="624" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b">excluded</text><text x="786" y="578" font-size="22" font-family="'IBM Plex Mono', Menlo, monospace" fill="#0053a3" font-weight="700">0/200</text><rect x="190" y="550" width="580" height="116" rx="3" fill="#ffffff" stroke="#cfd8dc" /><text x="204" y="571" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">SAMPLE 0</text><text x="204" y="592" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">“profession as a journalist made Nikolai fascinated to</text><text x="204" y="612" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">work on music, books, and movies, even leading to the</text><text x="204" y="632" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">production of a short horror film under his production</text><text x="204" y="652" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">house.”</text><rect x="190" y="672" width="580" height="76" rx="3" fill="#ffffff" stroke="#cfd8dc" /><text x="204" y="693" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">SAMPLE 1</text><text x="204" y="714" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">“education greatly influenced Nikolai Abilov’s</text><text x="204" y="734" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">writing.”</text><line x1="24" x2="876" y1="760" y2="760" stroke="#cfd8dc" /><text x="24" y="792" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#263238" font-weight="700">never stored</text><text x="24" y="818" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b">the reference</text><text x="24" y="840" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b">condition</text><text x="786" y="794" font-size="22" font-family="'IBM Plex Mono', Menlo, monospace" fill="#0053a3" font-weight="700">0/200</text><rect x="190" y="766" width="580" height="56" rx="3" fill="#ffffff" stroke="#cfd8dc" /><text x="204" y="787" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">SAMPLE 0</text><text x="204" y="808" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">“writing both inspired him.”</text><rect x="190" y="828" width="580" height="96" rx="3" fill="#ffffff" stroke="#cfd8dc" /><text x="204" y="849" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#607d8b" font-weight="700">SAMPLE 1</text><text x="204" y="870" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">“passion for storytelling created a nurturing</text><text x="204" y="890" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">environment that influenced his identity as a</text><text x="204" y="910" font-size="17" font-family="'IBM Plex Mono', Menlo, monospace" fill="#263238">children’s book author.”</text><line x1="24" x2="876" y1="936" y2="936" stroke="#cfd8dc" /><text x="24" y="963" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#0053a3">Edited policy and never stored have the same per-query exact-phrase count.</text><text x="24" y="988" font-size="17" font-family="Figtree, Helvetica, Arial, sans-serif" fill="#0053a3">The sampled wording differs.</text></svg>